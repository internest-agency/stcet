<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" role="img" aria-labelledby="mapTitle mapDesc" font-family="Segoe UI, Arial, sans-serif">
  <title id="mapTitle">Map of the STCET admin screen</title>
  <desc id="mapDesc">A browser window showing the admin: a left sidebar listing every content module, a header with the page title and the signed-in account email, and a content area with summary cards.</desc>

  <rect width="960" height="620" fill="#f8fafc"/>

  <!-- browser frame -->
  <rect x="24" y="24" width="912" height="520" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <line x1="24" y1="58" x2="936" y2="58" stroke="#e2e8f0"/>
  <circle cx="46" cy="41" r="4" fill="#f87171"/>
  <circle cx="60" cy="41" r="4" fill="#fbbf24"/>
  <circle cx="74" cy="41" r="4" fill="#34d399"/>
  <rect x="94" y="32" width="270" height="18" rx="9" fill="#f1f5f9"/>
  <text x="104" y="45" font-size="10" fill="#64748b">stcet.in/admin/dashboard</text>

  <!-- sidebar -->
  <rect x="24" y="58" width="244" height="486" fill="#fbfdff"/>
  <line x1="268" y1="58" x2="268" y2="544" stroke="#e2e8f0"/>

  <rect x="42" y="76" width="28" height="28" rx="6" fill="#001747"/>
  <text x="80" y="88" font-size="12" font-weight="700" fill="#0f172a">STCET</text>
  <text x="80" y="101" font-size="8" letter-spacing="1.2" fill="#64748b">WEBSITE ADMIN</text>
  <text x="46" y="132" font-size="8" font-weight="700" letter-spacing="1.2" fill="#94a3b8">WORKSPACE</text>

  <!-- active link -->
  <rect x="40" y="138" width="212" height="20" rx="5" fill="#eef4ff"/>
  <circle cx="53" cy="148" r="3" fill="#002370"/>
  <text x="65" y="152" font-size="11" font-weight="700" fill="#002370">Dashboard</text>

  <g font-size="11" fill="#475569">
    <circle cx="53" cy="170" r="3" fill="#94a3b8"/><text x="65" y="174">Enquiries</text>
    <circle cx="53" cy="192" r="3" fill="#94a3b8"/><text x="65" y="196">Contact Messages</text>
    <circle cx="53" cy="214" r="3" fill="#94a3b8"/><text x="65" y="218">Events</text>
    <circle cx="53" cy="236" r="3" fill="#94a3b8"/><text x="65" y="240">Courses</text>
    <circle cx="53" cy="258" r="3" fill="#94a3b8"/><text x="65" y="262">Faculty</text>
    <circle cx="53" cy="280" r="3" fill="#94a3b8"/><text x="65" y="284">Gallery</text>
    <circle cx="53" cy="302" r="3" fill="#94a3b8"/><text x="65" y="306">Admissions</text>
    <circle cx="53" cy="324" r="3" fill="#94a3b8"/><text x="65" y="328">Placements</text>
    <circle cx="53" cy="346" r="3" fill="#94a3b8"/><text x="65" y="350">Media</text>
    <circle cx="53" cy="368" r="3" fill="#94a3b8"/><text x="65" y="372">SEO</text>
    <circle cx="53" cy="390" r="3" fill="#94a3b8"/><text x="65" y="394">Users</text>
    <circle cx="53" cy="412" r="3" fill="#94a3b8"/><text x="65" y="416">Settings</text>
    <circle cx="53" cy="434" r="3" fill="#94a3b8"/><text x="65" y="438" fill="#94a3b8">… more modules</text>
  </g>

  <!-- account block -->
  <line x1="40" y1="456" x2="252" y2="456" stroke="#e2e8f0"/>
  <circle cx="56" cy="480" r="11" fill="#dbeafe"/>
  <text x="56" y="484" font-size="9" font-weight="700" text-anchor="middle" fill="#1e40af">A</text>
  <text x="74" y="477" font-size="10" font-weight="700" fill="#1f2937">Asha Kumar</text>
  <text x="74" y="490" font-size="9" fill="#64748b">Administrator</text>
  <circle cx="53" cy="512" r="3" fill="#94a3b8"/>
  <text x="65" y="516" font-size="10" fill="#475569">Sign out</text>

  <!-- header -->
  <text x="288" y="86" font-size="8" font-weight="700" letter-spacing="1.2" fill="#64748b">STCET / ADMIN</text>
  <text x="288" y="108" font-size="16" font-weight="700" fill="#0f172a">Dashboard</text>
  <text x="908" y="102" font-size="11" text-anchor="end" fill="#475569">admin@stcet.in</text>

  <!-- content -->
  <rect x="268" y="124" width="668" height="420" fill="#f8fafc"/>

  <!-- stat cards -->
  <g>
    <rect x="284" y="140" width="148" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="296" y="160" font-size="9" fill="#64748b">Total Enquiries</text>
    <text x="296" y="188" font-size="20" font-weight="700" fill="#0f172a">128</text>
    <rect x="398" y="150" width="18" height="18" rx="5" fill="#eef4ff"/>

    <rect x="448" y="140" width="148" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="460" y="160" font-size="9" fill="#64748b">New Enquiries</text>
    <text x="460" y="188" font-size="20" font-weight="700" fill="#0f172a">12</text>
    <rect x="562" y="150" width="18" height="18" rx="5" fill="#fff7ed"/>

    <rect x="612" y="140" width="148" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="624" y="160" font-size="9" fill="#64748b">Contact Messages</text>
    <text x="624" y="188" font-size="20" font-weight="700" fill="#0f172a">34</text>
    <rect x="726" y="150" width="18" height="18" rx="5" fill="#eef4ff"/>

    <rect x="776" y="140" width="148" height="64" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="788" y="160" font-size="9" fill="#64748b">Unresolved</text>
    <text x="788" y="188" font-size="20" font-weight="700" fill="#0f172a">5</text>
    <rect x="890" y="150" width="18" height="18" rx="5" fill="#fef2f2"/>
  </g>

  <!-- panels -->
  <rect x="284" y="220" width="316" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="244" font-size="12" font-weight="700" fill="#0f172a">Latest Enquiries</text>
  <text x="584" y="244" font-size="9" text-anchor="end" fill="#002370">All →</text>
  <g fill="#e2e8f0">
    <rect x="300" y="262" width="120" height="8" rx="4"/>
    <rect x="300" y="290" width="104" height="8" rx="4"/>
    <rect x="300" y="318" width="132" height="8" rx="4"/>
  </g>
  <g fill="#f1f5f9">
    <rect x="300" y="276" width="168" height="6" rx="3"/>
    <rect x="300" y="304" width="150" height="6" rx="3"/>
    <rect x="300" y="332" width="176" height="6" rx="3"/>
  </g>
  <g fill="#eff6ff">
    <rect x="536" y="262" width="48" height="14" rx="7"/>
    <rect x="536" y="290" width="48" height="14" rx="7"/>
    <rect x="536" y="318" width="48" height="14" rx="7"/>
  </g>

  <rect x="600" y="220" width="324" height="150" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="616" y="244" font-size="12" font-weight="700" fill="#0f172a">Recent Messages</text>
  <text x="908" y="244" font-size="9" text-anchor="end" fill="#002370">All →</text>
  <g fill="#e2e8f0">
    <rect x="616" y="262" width="140" height="8" rx="4"/>
    <rect x="616" y="290" width="116" height="8" rx="4"/>
    <rect x="616" y="318" width="152" height="8" rx="4"/>
  </g>
  <g fill="#f1f5f9">
    <rect x="616" y="276" width="190" height="6" rx="3"/>
    <rect x="616" y="304" width="166" height="6" rx="3"/>
    <rect x="616" y="332" width="198" height="6" rx="3"/>
  </g>
  <g fill="#eff6ff">
    <rect x="852" y="262" width="56" height="14" rx="7"/>
    <rect x="852" y="290" width="56" height="14" rx="7"/>
    <rect x="852" y="318" width="56" height="14" rx="7"/>
  </g>

  <!-- course summary -->
  <rect x="284" y="386" width="640" height="92" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="300" y="410" font-size="12" font-weight="700" fill="#0f172a">Course Catalog Content</text>
  <text x="908" y="410" font-size="9" text-anchor="end" fill="#002370">Manage courses →</text>
  <text x="300" y="436" font-size="9" fill="#64748b">Total Courses</text>
  <text x="300" y="460" font-size="18" font-weight="700" fill="#0f172a">5</text>
  <text x="470" y="436" font-size="9" fill="#64748b">Published</text>
  <text x="470" y="460" font-size="18" font-weight="700" fill="#106b39">4</text>
  <text x="640" y="436" font-size="9" fill="#64748b">Drafts</text>
  <text x="640" y="460" font-size="18" font-weight="700" fill="#b45309">1</text>

  <!-- numbered callouts -->
  <g>
    <circle cx="256" cy="148" r="11" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
    <text x="256" y="152" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>

    <circle cx="392" cy="106" r="11" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
    <text x="392" y="110" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>

    <circle cx="756" cy="98" r="11" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
    <text x="756" y="102" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>

    <circle cx="128" cy="512" r="10" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
    <text x="128" y="516" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>

    <circle cx="474" cy="211" r="10" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
    <text x="474" y="215" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
  </g>

  <!-- legend -->
  <g font-size="11" fill="#334155">
    <circle cx="40" cy="566" r="10" fill="#b45309"/>
    <text x="40" y="570" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
    <text x="58" y="570">Sidebar: every CMS module lives here.</text>

    <circle cx="372" cy="566" r="10" fill="#b45309"/>
    <text x="372" y="570" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
    <text x="390" y="570">Page title for the open module.</text>

    <circle cx="676" cy="566" r="10" fill="#b45309"/>
    <text x="676" y="570" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
    <text x="694" y="570">Your account email.</text>

    <circle cx="40" cy="600" r="10" fill="#b45309"/>
    <text x="40" y="604" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="58" y="604">Sign out when you finish.</text>

    <circle cx="216" cy="600" r="10" fill="#b45309"/>
    <text x="216" y="604" font-size="9" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
    <text x="234" y="604">Work area for the selected module.</text>
  </g>
</svg>
