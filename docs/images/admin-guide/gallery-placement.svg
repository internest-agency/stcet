<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="galTitle galDesc" font-family="Segoe UI, Arial, sans-serif">
  <title id="galTitle">Where a gallery image appears</title>
  <desc id="galDesc">One uploaded image has two independent visibility switches, Home page and Gallery page, plus a Published flag. Either switch, both, or neither can be on.</desc>

  <defs>
    <marker id="galArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="960" height="450" fill="#ffffff"/>

  <text x="32" y="42" font-size="20" font-weight="700" fill="#0f172a">Where a gallery image appears</text>
  <text x="32" y="66" font-size="12" fill="#64748b">Each image has two independent switches, plus the Published flag. Both, either one, or neither can be on.</text>

  <!-- panel 1 -->
  <rect x="32" y="90" width="250" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="48" y="116" font-size="13" font-weight="700" fill="#0f172a">1. The image</text>

  <rect x="48" y="128" width="218" height="104" rx="6" fill="#e2e8f0"/>
  <circle cx="106" cy="170" r="14" fill="#cbd5e1"/>
  <path d="M48 232 L104 192 L142 218 L176 190 L266 232 Z" fill="#cbd5e1" opacity="0.85"/>
  <text x="48" y="250" font-size="10" fill="#64748b">photo.jpg — max 1 MB</text>

  <text x="48" y="274" font-size="11" fill="#334155"><tspan font-weight="700">Title</tspan> (required)</text>
  <text x="48" y="292" font-size="11" fill="#334155"><tspan font-weight="700">Alt text</tspan> (required)</text>
  <text x="48" y="310" font-size="11" fill="#334155"><tspan font-weight="700">Category</tspan> · <tspan font-weight="700">Display order</tspan></text>
  <text x="48" y="328" font-size="10" fill="#64748b">JPEG, PNG or WebP only.</text>

  <!-- panel 2 -->
  <rect x="310" y="90" width="250" height="250" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="326" y="116" font-size="13" font-weight="700" fill="#0f172a">2. Show on pages</text>

  <rect x="326" y="132" width="16" height="16" rx="3" fill="#002370"/>
  <path d="M330 140 L334 144 L339 135" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="352" y="145" font-size="12" fill="#1f2937">Home page</text>

  <rect x="326" y="164" width="16" height="16" rx="3" fill="#002370"/>
  <path d="M330 172 L334 176 L339 167" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="352" y="177" font-size="12" fill="#1f2937">Gallery page</text>

  <line x1="326" y1="196" x2="544" y2="196" stroke="#e2e8f0"/>

  <rect x="326" y="208" width="16" height="16" rx="3" fill="#ffffff" stroke="#94a3b8"/>
  <text x="352" y="221" font-size="12" fill="#1f2937">Published</text>

  <text x="326" y="256" font-size="10.5" fill="#64748b">Both switches can be on, either</text>
  <text x="326" y="272" font-size="10.5" fill="#64748b">one alone, or neither. The image</text>
  <text x="326" y="288" font-size="10.5" fill="#64748b">must also be Published to appear.</text>

  <rect x="326" y="304" width="218" height="22" rx="5" fill="#fff7ed" stroke="#fdba74"/>
  <text x="336" y="319" font-size="10" font-weight="700" fill="#b45309">Uncheck both = saved but hidden</text>

  <!-- arrows -->
  <path d="M562 168 C578 168 574 148 588 148" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#galArrow)"/>
  <path d="M562 262 C578 262 574 282 588 282" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#galArrow)"/>

  <!-- home surface -->
  <rect x="590" y="90" width="338" height="110" rx="10" fill="#fbfdff" stroke="#cbd5e1"/>
  <text x="606" y="114" font-size="12" font-weight="700" fill="#0f172a">Home page — gallery strip</text>
  <g>
    <rect x="606" y="126" width="66" height="52" rx="4" fill="#e2e8f0"/>
    <rect x="684" y="126" width="66" height="52" rx="4" fill="#e2e8f0"/>
    <rect x="762" y="126" width="66" height="52" rx="4" fill="#e2e8f0"/>
    <rect x="840" y="126" width="66" height="52" rx="4" fill="#eef4ff" stroke="#002370" stroke-width="2"/>
  </g>
  <text x="873" y="156" font-size="8" font-weight="700" text-anchor="middle" fill="#002370">NEW</text>
  <text x="606" y="192" font-size="9.5" fill="#64748b">Uses images with Home page ticked + Published + active category.</text>

  <!-- gallery surface -->
  <rect x="590" y="220" width="338" height="136" rx="10" fill="#fbfdff" stroke="#cbd5e1"/>
  <text x="606" y="244" font-size="12" font-weight="700" fill="#0f172a">/gallery — full grid</text>
  <g>
    <rect x="606" y="256" width="66" height="34" rx="4" fill="#e2e8f0"/>
    <rect x="684" y="256" width="66" height="34" rx="4" fill="#e2e8f0"/>
    <rect x="762" y="256" width="66" height="34" rx="4" fill="#e2e8f0"/>
    <rect x="840" y="256" width="66" height="34" rx="4" fill="#eef4ff" stroke="#002370" stroke-width="2"/>
    <rect x="606" y="298" width="66" height="34" rx="4" fill="#e2e8f0"/>
    <rect x="684" y="298" width="66" height="34" rx="4" fill="#e2e8f0"/>
    <rect x="762" y="298" width="66" height="34" rx="4" fill="#e2e8f0"/>
    <rect x="840" y="298" width="66" height="34" rx="4" fill="#e2e8f0"/>
  </g>
  <text x="606" y="348" font-size="9.5" fill="#64748b">Uses images with Gallery page ticked + Published + active category.</text>

  <!-- footer note -->
  <rect x="32" y="362" width="896" height="58" rx="10" fill="#f8fafc" stroke="#e2e8f0"/>
  <circle cx="54" cy="384" r="3" fill="#002370"/>
  <text x="68" y="388" font-size="11" fill="#334155">Bundled fallback photos appear only when the database has no matching published images for that surface.</text>
  <circle cx="54" cy="406" r="3" fill="#002370"/>
  <text x="68" y="410" font-size="11" fill="#334155">Deleting an image removes its file only if no other content still uses it.</text>
</svg>
